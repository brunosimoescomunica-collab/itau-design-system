
<!-- ───────── UI FIXA · carga estrutural, não editar ───────── -->
<div class="prog" id="prog"></div>
<div class="dots" id="dots"></div>
<div class="count"><b id="cur">01</b> / <span id="tot">{{TOTAL}}</span></div>
<div class="wm"><b>itaú</b> <span>× @africa creative/™</span></div>
<div class="nav">
  <button id="prev" aria-label="Slide anterior"><svg viewBox="0 0 10 10"><path d="M7 1 3 5l4 4"/></svg></button>
  <button id="next" aria-label="Próximo slide"><svg viewBox="0 0 10 10"><path d="M3 1l4 4-4 4"/></svg></button>
</div>
<div class="tools">
  <button id="bw" aria-label="Alternar modo claro e escuro">B</button>
  <button id="nt" aria-label="Mostrar roteiro do palco">N</button>
</div>
<div class="notes" id="notes"><span class="nk">Roteiro do palco · tecla N</span><span id="ntx"></span></div>

<script>
(function(){
  var root = document.documentElement;
  var slides = [].slice.call(document.querySelectorAll('.slide'));

  /* cabeçalho corrente: o selo da Africa no canto superior esquerdo, na linha
     dos botões B e N. O miolo carrega os dois marks; o CSS mostra o gradiente
     sobre branco e o chapado sobre laranja, preto e azul. Slides .bare não levam. */
  var SEAL = '<svg class="hseal" viewBox="0 0 200 200" aria-hidden="true"><g class="ring"><text>' +
    '<textPath href="#ring-hd" startOffset="0" textLength="500" lengthAdjust="spacing">AFRICA CREATIVE/™ · AFRICA CREATIVE/™ · </textPath>' +
    '</text></g><g transform="translate(55.15,50.85) scale(1.2)">' +
    '<use class="mg" href="#mark-g" width="74.76" height="81.9"/>' +
    '<use class="mf" href="#mark" width="74.76" height="81.9"/></g></svg>';
  slides.forEach(function(s){
    if(s.classList.contains('bare')) return;
    var h = document.createElement('div');
    h.className = 'hd';
    h.innerHTML = SEAL;
    s.querySelector('.frame').appendChild(h);
  });

  document.querySelectorAll('.frame').forEach(function(fr){
    var g = document.createElement('div');
    g.className = 'gridlay';
    g.innerHTML = '<div class="cols">' + '<i></i>'.repeat(12) + '</div><div class="mg"></div>';
    fr.appendChild(g);
  });

  var dots = document.getElementById('dots');
  var cur = document.getElementById('cur'), tot = document.getElementById('tot');
  var prog = document.getElementById('prog');
  var prev = document.getElementById('prev'), next = document.getElementById('next');
  var notes = document.getElementById('notes'), ntx = document.getElementById('ntx');
  var idx = 0;
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  tot.textContent = pad(slides.length);
  slides.forEach(function(s, i){
    var b = document.createElement('button');
    b.title = s.dataset.title || ('Slide ' + (i + 1));
    b.addEventListener('click', function(){ go(i); });
    dots.appendChild(b);
  });
  var dotEls = [].slice.call(dots.children);

  /* a UI fixa lê o fundo do slide corrente, não o modo da página: número da
     página, marca d'água e botões sempre com leitura sobre branco, laranja,
     preto ou azul. Fundo transparente cai no modo (tecla B). */
  function lum(el){
    var m = (getComputedStyle(el).backgroundColor || '').match(/[\d.]+/g);
    if(!m || m.length < 3 || (m.length > 3 && parseFloat(m[3]) === 0)) return null;
    var f = function(v){ v = v / 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
    return .2126 * f(+m[0]) + .7152 * f(+m[1]) + .0722 * f(+m[2]);
  }
  function uiFor(s){
    var l = lum(s);
    var dark = l === null ? root.dataset.mode === 'dark' : l < .18;
    root.dataset.ui = dark ? 'dark' : 'light';
  }

  function go(i){ i = Math.max(0, Math.min(slides.length - 1, i)); slides[i].scrollIntoView({behavior:'smooth'}); }
  function paint(i){
    idx = i;
    cur.textContent = pad(i + 1);
    prog.style.width = ((i + 1) / slides.length * 100) + '%';
    dotEls.forEach(function(d, k){ d.classList.toggle('on', k === i); });
    prev.disabled = i === 0; next.disabled = i === slides.length - 1;
    ntx.textContent = slides[i].dataset.notes || 'Sem roteiro neste slide.';
    uiFor(slides[i]);
  }

  /* .visible entra e sai: tudo re-anima na revisita */
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){
      var i = slides.indexOf(e.target);
      if(e.isIntersecting){ e.target.classList.add('visible'); paint(i); }
      else e.target.classList.remove('visible');
    });
  }, {threshold:.5});
  slides.forEach(function(s){ io.observe(s); });

  prev.addEventListener('click', function(){ go(idx - 1); });
  next.addEventListener('click', function(){ go(idx + 1); });
  document.addEventListener('keydown', function(e){
    var k = e.key;
    if(k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'j'){ e.preventDefault(); go(idx + 1); }
    else if(k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'k'){ e.preventDefault(); go(idx - 1); }
    else if(k === 'Home'){ e.preventDefault(); go(0); }
    else if(k === 'End'){ e.preventDefault(); go(slides.length - 1); }
    else if(k === 'n' || k === 'N'){ toggleNotes(); }
    else if(k === 'b' || k === 'B'){ toggleMode(); }
    else if(k === 'g' || k === 'G'){ root.dataset.grid = root.dataset.grid === '1' ? '0' : '1'; }
  });
  var y0 = null;
  addEventListener('touchstart', function(e){ y0 = e.touches[0].clientY; }, {passive:true});
  addEventListener('touchend', function(e){
    if(y0 === null) return;
    var dy = y0 - e.changedTouches[0].clientY;
    if(Math.abs(dy) > 60) go(idx + (dy > 0 ? 1 : -1));
    y0 = null;
  }, {passive:true});

  function toggleNotes(){ var on = notes.classList.toggle('on'); document.getElementById('nt').classList.toggle('on', on); }
  document.getElementById('nt').addEventListener('click', toggleNotes);
  var bw = document.getElementById('bw');
  function toggleMode(){ var dark = root.dataset.mode === 'dark'; root.dataset.mode = dark ? 'light' : 'dark'; bw.textContent = dark ? 'B' : 'P'; uiFor(slides[idx]); }
  bw.addEventListener('click', toggleMode);
  if(location.search.indexOf('mode=dark') > -1) toggleMode();

  var m = location.hash.match(/^#s(\d+)$/);
  if(m) setTimeout(function(){ go(parseInt(m[1], 10) - 1); }, 60);
  paint(0);
  slides[0].classList.add('visible');
})();
</script>
</body>
</html>
